# --------------------------------------------------------------------------
# 11c. Validation / adjudication plane (Phase 15A.3)
# --------------------------------------------------------------------------
# EVERY gate below is either restated by this protocol or INHERITED UNCHANGED from
# the frozen Phase 13 default that section 0 says Phase 15 does not replace.
# Nothing was chosen from ML performance -- no model has been fitted, so there is
# none to choose from. That is why the plane is frozen NOW.
validation_plane:
  manifest: data/manifests/phase_15/ml_validation_plane_adjudication_corrected.json
  manifest_15a3: data/manifests/phase_15/ml_validation_plane.json   # preserved
  module: alpha_agent.ml.adjudication
  freeze_script: scripts/phase_15b_adjudication_freeze.py  # supersedes phase_15a3_validation_freeze.py
  validation_spec_schema: ml-validation-spec/1
  scope: FAMILY-WIDE -- one spec for all 60 trials, so the six identity planes are
         genuinely shared and the 15A.2 uniqueness proof carries over
  capital_base_usd: 100000.0            # inherited unchanged from Phase 13.5C
  fold_evidence_source: nested_cv_outer_test_blocks   # Phase 15 has no Phase 13 walk-forward
  null_plan:
    methods: [centered_block_bootstrap]  # the GATING null, and nothing else
    n_null_samples: 199
    block_length: 20
    seed: 0
    excluded: [schedule_time_shift, circular_schedule_permutation]
    exclusion_reason: >-
      A schedule-based null reruns the C++ engine once per replicate. Section 15
      declares one null "requiring no extra C++ runs" and section 14 budgets 240
      C++ evaluations; including a schedule null would need order 12,000 more runs
      and contradict the frozen accounting.
      assert_null_plan_fits_frozen_compute_budget enforces the link.
  reliability_policy:
    inherited_unchanged_from: phase_13_5c
    fdr_q_threshold: 0.10               # PROTOCOL (section 10 bh_q); checked to AGREE
    null_p_value_max: 0.05              # inherited Phase 13 default
    dsr_min: 0.95                       # inherited Phase 13 default
    max_cost_degradation: 0.5           # inherited; read off the 1.5x / 2.0x reruns
    fold_consistency_min: 0.5           # inherited; over the five outer test blocks
    require_positive_oos_net_pnl: true  # inherited
    minimum_sample: {min_oos_trading_days: 60, min_fills: 20, min_trades: 10,
                     min_walk_forward_folds: 3, min_nonzero_return_days: 20}
    require_regime_stability: false     # inherited; regime evidence stays descriptive
    require_cross_market: false         # inherited; cross-root summaries are descriptive
    require_ablation_mechanism_value: false  # the regime ablation is its own BH trial
    gate_provenance: RELIABILITY_GATE_SOURCES names the origin of EVERY field; an
                     unsourced gate fails closed
  baseline_comparison:
    baseline_arm: PRIMARY
    treatment_arm: META_LABELED
    baseline_cost_scenario: baseline_1_0x
    stress_cost_scenarios: [stress_1_5x, stress_2_0x]
    delta_vs_primary_is_gated: false
    delta_note: >-
      Section 9 REPORTS economic_delta_vs_primary and declares no PASS/REJECT
      threshold for it. Gating on it would be an invented rule, and
      MLBaselineComparisonPlan refuses to be constructed that way.
  hyperparameter_plateau_evidence: diagnostic_inner_objective_only
  parameter_stability_gate_applies: false
  parameter_stability_note: >-
    The frozen budget evaluates economics for the SELECTED pipeline only (60
    primary + 180 meta-labeled), so no per-hyperparameter-point out-of-sample
    economics exist to build a Phase 13 ParameterStabilityResult from, and section
    16 step 8 declares no threshold for a plateau gate. Recorded as a diagnostic and
    gating on nothing. The policy's param_stability_* values are left at their
    inherited Phase 13 values so that if such evidence is ever produced it is judged
    by a threshold nobody invented after the fact. An ECONOMIC plateau gate is a NEW
    frozen research semantic requiring approval -- see docs section 17 limitation 10.
  ml_diagnostics_gate_verdict: false    # classification metrics are diagnostic only

  # Phase 15B -- two Phase-15-specific adjudication rules, layered on the
  # inherited Phase 13 ReliabilityPolicy WITHOUT modifying it. Frozen before any
  # real event corpus, model fit or ML performance.
  phase_15b_adjudication_rules:
    freeze_script: scripts/phase_15b_adjudication_freeze.py
    manifest: data/manifests/phase_15/ml_validation_plane_adjudication_corrected.json
    core_phase_13_reliability_policy_modified: false
    # Rule 1 -- the predeclared BH family is ALWAYS exactly 60 hypotheses.
    bh_family_size: 60
    family_size_is_fixed: true
    refused_trial_bh_p_value: 1.0
    refused_trial_note: >-
      A trial that a typed refusal/failure keeps from producing a valid
      statistical result is never silently dropped from the family: it enters BH
      accounting at the conservative p = 1 (never significant) and its actual
      typed refusal/failure is preserved in the registry.
    # Rule 2 -- a Phase 15 PASS must demonstrate the ML filter ADDS VALUE.
    require_meta_beats_primary_daily_sharpe: true
    meta_vs_primary_sharpe_support: exactly_aligned
    placebo_draws: 20
    placebo_comparison_statistic: daily_sharpe
    placebo_empirical_p_formula: "(1 + count(placebo_stat >= observed_stat)) / (draws + 1)"
    placebo_empirical_p_max: 0.05
    placebo_remains_a_control_not_a_bh_hypothesis: true
    pass_gate_note: >-
      On top of the inherited ReliabilityPolicy PASS, a Phase 15 trial must show
      meta daily Sharpe > primary daily Sharpe on exactly aligned support AND the
      predeclared 20-draw TAKE-rate-matched placebo must satisfy empirical
      p <= 0.05. This separates "the filter chose well" from "the filtered
      strategy is merely profitable standalone" / "the model simply traded less".

# --------------------------------------------------------------------------
# 12. Placebo / nulls
# --------------------------------------------------------------------------
nulls:
  gating: centered_block_bootstrap on the meta-labeled OOS daily net returns
  placebo: random meta-labeler matched on the realised TAKE rate
  placebo_draws: 20
  placebo_policy: conditional_on_gating_null_rejection
  placebo_expected_count: near zero given the Phase 13.5C prior (0 PASS in 107)
